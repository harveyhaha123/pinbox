name: temp-vault-frame-extract

on:
  push:
    branches:
      - tmp-vault-frame-extract

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --upgrade yt-dlp

      - name: Download 45-degree school-style straddle-vault clip
        run: |
          mkdir -p work
          yt-dlp --no-playlist --socket-timeout 30 --retries 3 \
            -f 'bestvideo[height<=1080]+bestaudio/best[height<=1080]/best' \
            --merge-output-format mp4 \
            -o 'work/cda_45deg.%(ext)s' \
            'https://www.cda.pl/video/40545014f/vfilm'
          ls -lh work

      - name: Extract accurate frame sequence
        run: |
          mkdir -p work/result/frames_24fps work/result/frames_native
          cp work/cda_45deg.mp4 work/result/cda_45deg_original.mp4
          ffprobe -v error -print_format json -show_format -show_streams \
            work/cda_45deg.mp4 > work/result/metadata.json

          ffmpeg -hide_banner -loglevel error -i work/cda_45deg.mp4 \
            -vf "fps=24,scale='min(1280,iw)':-2:flags=lanczos" -q:v 1 \
            work/result/frames_24fps/F_%04d.jpg

          ffmpeg -hide_banner -loglevel error -i work/cda_45deg.mp4 \
            -vsync 0 -q:v 1 work/result/frames_native/N_%04d.jpg

          ffmpeg -hide_banner -loglevel error -i work/cda_45deg.mp4 \
            -vf "fps=8,scale=640:-2:flags=lanczos,pad=640:400:(ow-iw)/2:(oh-ih)/2:white,tile=4x4" \
            -q:v 1 work/result/contact_%02d.jpg

          ffmpeg -hide_banner -loglevel error -i work/cda_45deg.mp4 \
            -vf "fps=12,scale=960:-2:flags=lanczos" -an \
            -c:v libx264 -crf 18 -preset medium -pix_fmt yuv420p \
            work/result/cda_45deg_12fps_reference.mp4

          find work/result -maxdepth 2 -type f -printf '%p %s bytes\n' | sort > work/result/file_list.txt
          du -sh work/result

      - name: Package compact result
        run: |
          cd work
          zip -r -q vault-final-small.zip result
          ls -lh vault-final-small.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vault-final-small
          path: work/vault-final-small.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

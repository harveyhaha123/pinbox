name: temp-vault-frame-extract

on:
  push:
    branches:
      - tmp-vault-frame-extract

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick curl jq

      - name: Download YouTube storyboard sprites
        shell: bash
        run: |
          set -u
          mkdir -p work/raw work/logs work/result
          fetch_storyboards() {
            name="$1"; id="$2"; mkdir -p "work/raw/$name" "work/result/$name"
            : > "work/logs/$name.log"
            for level in L0 L1 L2 L3; do
              for m in $(seq 0 40); do
                url="https://i.ytimg.com/sb/${id}/storyboard3_${level}/M${m}.jpg"
                out="work/raw/${name}/${level}_M${m}.jpg"
                code=$(curl -A 'Mozilla/5.0' -L --connect-timeout 10 --max-time 30 -sS -w '%{http_code}' "$url" -o "$out" || true)
                size=$(wc -c < "$out" 2>/dev/null || echo 0)
                echo "$level M$m HTTP $code bytes $size" >> "work/logs/$name.log"
                if [ "$code" != "200" ] || [ "$size" -lt 1000 ]; then
                  rm -f "$out"
                  [ "$m" -ge 2 ] && break
                fi
              done
            done
            # Copy the highest available level to result and split 5x5 sprite tiles.
            best=''
            for level in L3 L2 L1 L0; do
              if compgen -G "work/raw/${name}/${level}_M*.jpg" > /dev/null; then best="$level"; break; fi
            done
            echo "best_level=$best" >> "work/logs/$name.log"
            [ -z "$best" ] && return 0
            mkdir -p "work/result/$name/sprites" "work/result/$name/tiles"
            cp work/raw/${name}/${best}_M*.jpg "work/result/$name/sprites/"
            idx=0
            for sprite in work/raw/${name}/${best}_M*.jpg; do
              identify "$sprite" >> "work/logs/$name.log" 2>&1 || true
              # YouTube storyboard sheets are usually 5x5. ImageMagick splits equal tiles.
              convert "$sprite" -crop 5x5@ +repage +adjoin "work/result/$name/tiles/frame_${idx}_%02d.jpg" || true
              idx=$((idx+1))
            done
            # Build an overview from all tiles.
            montage work/result/$name/tiles/*.jpg -tile 5x -geometry +4+24 -background white "work/result/$name/overview.jpg" || true
          }
          fetch_storyboards full_example 8nhKxitUuY8
          fetch_storyboards exercise_3 DhsOuN6hU4c
          find work/result -type f -printf '%p %s bytes\n' | sort > work/result/file_list.txt
          cp -r work/logs work/result/logs

      - name: Package result
        run: |
          cd work && zip -r -q youtube-storyboards.zip result && ls -lh youtube-storyboards.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-storyboards
          path: work/youtube-storyboards.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

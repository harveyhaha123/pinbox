name: temp-vault-frame-extract

on:
  push:
    branches:
      - tmp-vault-frame-extract

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl

      - name: Download candidate school-style vaulting-box clips
        shell: bash
        run: |
          set -u
          mkdir -p work/videos work/logs
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          download_direct() {
            name="$1"; url="$2"
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 \
              -A "$UA" -e "${url%/*}/" "$url" -o "work/videos/${name}.mp4" \
              >"work/logs/${name}.log" 2>&1 || true
          }
          download_direct nijiiro 'https://www.nijiiro-kids-taisou-labo.com/wp-content/uploads/2021/02/open-leg-jump-of-the-vaulting-box-1.mp4'
          download_direct machida_T4 'https://machidabunkayouchien.com/wp/wp-content/uploads/2025/06/T4.mp4'
          download_direct machida_T5 'https://machidabunkayouchien.com/wp/wp-content/uploads/2025/06/T5.mp4'
          download_direct machida_T6 'https://machidabunkayouchien.com/wp/wp-content/uploads/2025/06/T6.mp4'
          download_direct houei 'https://yukiyamafukushikai.com/houei/wp/wp-content/uploads/2022/01/IMG_3449-video-converter.com_.mp4'
          find work/videos -type f -maxdepth 1 -printf '%f %s bytes\n' | sort | tee work/downloaded_files.txt

      - name: Build lightweight visual previews
        shell: bash
        run: |
          set -u
          mkdir -p work/result
          shopt -s nullglob
          for f in work/videos/*.mp4; do
            stem="$(basename "$f" .mp4)"
            if ! ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f" >"work/result/${stem}_duration.txt" 2>"work/result/${stem}_error.txt"; then
              continue
            fi
            mkdir -p "work/result/${stem}"
            ffprobe -v error -print_format json -show_format -show_streams "$f" >"work/result/${stem}/metadata.json"
            ffmpeg -hide_banner -loglevel error -i "$f" \
              -vf "fps=5,scale=640:-2:flags=lanczos,pad=640:400:(ow-iw)/2:(oh-ih)/2:white,tile=4x4" \
              -q:v 2 "work/result/${stem}/contact_%02d.jpg" || true
            ffmpeg -hide_banner -loglevel error -i "$f" \
              -vf "fps=8,scale=640:-2:flags=lanczos" -an \
              -c:v libx264 -crf 23 -preset veryfast -pix_fmt yuv420p \
              "work/result/${stem}/${stem}_preview.mp4" || true
            ffmpeg -hide_banner -loglevel error -ss 0 -i "$f" -frames:v 1 -vf "scale=960:-2:flags=lanczos" -q:v 2 \
              "work/result/${stem}/${stem}_first.jpg" || true
          done
          find work/result -type f -printf '%p %s bytes\n' | sort > work/result/file_list.txt
          du -sh work/result

      - name: Package candidate previews
        run: |
          cd work
          zip -r -q vault-candidate-previews.zip result logs downloaded_files.txt
          ls -lh vault-candidate-previews.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vault-candidate-previews
          path: work/vault-candidate-previews.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
